{{- if and .Values.postgresql.enabled (not .Values.catalog.external.enabled) }}
{{- $name := printf "%s-postgresql" (include "ducklake.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ducklake.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.postgresql.auth.password }}
  password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  {{- else if and $existing (hasKey $existing.data "password") }}
  password: {{ index $existing.data "password" | quote }}
  {{- else }}
  password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
