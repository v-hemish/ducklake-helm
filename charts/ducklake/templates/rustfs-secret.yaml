{{- if .Values.rustfs.enabled }}
{{- $name := printf "%s-rustfs" (include "ducklake.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ducklake.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.rustfs.auth.accessKey }}
  access-key: {{ .Values.rustfs.auth.accessKey | b64enc | quote }}
  {{- else if and $existing (hasKey $existing.data "access-key") }}
  access-key: {{ index $existing.data "access-key" | quote }}
  {{- else }}
  access-key: {{ randAlphaNum 20 | b64enc | quote }}
  {{- end }}
  {{- if .Values.rustfs.auth.secretKey }}
  secret-key: {{ .Values.rustfs.auth.secretKey | b64enc | quote }}
  {{- else if and $existing (hasKey $existing.data "secret-key") }}
  secret-key: {{ index $existing.data "secret-key" | quote }}
  {{- else }}
  secret-key: {{ randAlphaNum 40 | b64enc | quote }}
  {{- end }}
  {{- if and $existing (hasKey $existing.data "rpc-secret") }}
  rpc-secret: {{ index $existing.data "rpc-secret" | quote }}
  {{- else }}
  rpc-secret: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
{{- end }}
