{{- if and (not .Values.rustfs.enabled) (not .Values.externalS3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ducklake.fullname" . }}-external-s3
  labels:
    {{- include "ducklake.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key: {{ required "externalS3.accessKey is required when rustfs.enabled=false and externalS3.existingSecret is empty" .Values.externalS3.accessKey | quote }}
  secret-key: {{ required "externalS3.secretKey is required when rustfs.enabled=false and externalS3.existingSecret is empty" .Values.externalS3.secretKey | quote }}
{{- end }}
